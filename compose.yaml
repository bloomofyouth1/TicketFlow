services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    env_file:
      - .env
    environment:
      TICKETFLOW_DB_PATH: /app/storage/ticketflow.db
      TICKETFLOW_ANALYZER: agent
      TICKETFLOW_LEGACY_STATUS_WRITES: "0"
    volumes:
      - ticketflow_data:/app/storage
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - streamlit
      - run
      - frontend/app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
      - --browser.gatherUsageStats
      - "false"
    environment:
      TICKETFLOW_API_URL: http://api:8000
    ports:
      - "127.0.0.1:6006:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ticketflow_data:
